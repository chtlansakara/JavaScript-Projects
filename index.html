<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Mini Projects</title>
    <style>
      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif';

      }

      .page-container {
        display: flex;
        justify-content: center;
      }

      .app-container {
        background-color: rgba(118, 176, 190, 0.4);
        width: 500px;
        border-radius: 5px;
        padding: 24px;
      }

      .app-title {
        margin-bottom: 24px;
        font-size: 20px;
        font-family: Verdana, Geneva, Tahoma, sans-serif;
      }

      .button-container {
        display: grid;
        grid-template-columns: 1fr 1fr;
        column-gap: 8px;
        margin-bottom: 8px;
      }


      .primary-button {
        border: none;
        border-radius: 5px;
        padding: 8px 16px;
        font-size: 16px;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: rgb(10, 66, 131);
        color: white;
        cursor: pointer;
        transition: all 0.14s;
        text-decoration: none;
        margin-bottom: 16px;
      }

      .primary-button:hover {
        background-color: rgb(14, 85, 165);
      }

      .primary-button:active {
        opacity: 0.8;
        box-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
      }


      .secondary-button {
        border-style: solid;
        border-width: 2px;
        border-color: rgba(14, 85, 165, 0.5);
        border-radius: 5px;
        padding: 5px 14px;
        font-size: 16px;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        color: black;
        cursor: pointer;
        transition: all 0.14s;
        text-decoration: none;
        margin-bottom: 16px;
      }

      .secondary-button:hover {
        background-color: rgba(138, 153, 170, 0.4);
        border-color: rgb(8, 46, 88);

      }

      .secondary-button:active {
        opacity: 0.8;
        box-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
      }

      .section-title {

        margin-bottom: 24px;
        font-size: 16px;
        font-family: Verdana, Geneva, Tahoma, sans-serif;
      }
    </style>
  </head>

  <body>
    <div class="page-container">

      <div class="app-container">
        <div class="app-title">JavaScript Mini-Projects</div>

        <div class="button-container">

          <a class="secondary-button" href="calculator.html">Calculator</a>
          <a class="secondary-button" href="ConvertTemp.html">Temparature Converter</a>
          <a class="secondary-button" href="./ConvertDistance/ConvertDistance.html">Distance Converter</a>
          <a class="secondary-button" href="./Cart/Cart-quantity.html">Shopping Cart</a>
          <a class="secondary-button" href="./CoinFlip/CoinFlip.html">Filp Coin</a>
          <a class="secondary-button" href="./ParkTickets/TicketTerminal.html">Park Ticket Terminal</a>
          <a class="secondary-button" href="./PercentageCalculator/PercentageCalculator.html">Percentage Calculator</a>
          <a class="secondary-button" href="./RockPaperScissors/RockPaperScissors.html">Rock Paper Scissors Game</a>

        </div>

        <div class="section-title">Forms</div>

        <div class="button-container">
          <a class="secondary-button" href="./Forms/1-UserCreationForm/UserCreateForm.html">User Creation Form</a>
          <a class="secondary-button" href="./Forms/2-AccountForm/CreateAccount.html">Account Creation Form</a>
          <a class="secondary-button" href="./Forms/3-UserForm/UserForm.html">Detailed User Form</a>

        </div>

      </div>



    </div>

  </body>

</html>
